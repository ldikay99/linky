name: ci
on:
  push:
    branches: [main, feat/**]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # CI sin keyring de escritorio: secretos solo en memoria.
      LINKY_SECRET_BACKEND: session
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run scan
      - run: npm run demo:mock
        env:
          LINKY_AZURE_MODE: mock
      - run: npm run demo:ripor
      - run: npm audit --audit-level=low

  web:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      LINKY_SECRET_BACKEND: session
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm ci --prefix web
      - run: npm --prefix web run typecheck
      - run: npm --prefix web test
      - run: npm --prefix web run build
      - run: npm --prefix web audit --audit-level=low

  # Pruebas de la web también contra PostgreSQL: el mismo servicio de docker-compose y el mismo script de inicio
  # que en el equipo (contraseñas aleatorias creadas en el runner; el contenedor se detiene al terminar).
  web-postgres:
    runs-on: ubuntu-latest
    env:
      LINKY_SECRET_BACKEND: session
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm ci --prefix web
      - run: npm run web:test:pg

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t linky-web:ci .
