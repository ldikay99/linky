name: ci
on:
  push:
    branches: [main, feat/**]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # CI sin keyring de escritorio: secretos solo en memoria.
      LINKY_SECRET_BACKEND: session
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run scan
      - run: npm run demo:mock
        env:
          LINKY_AZURE_MODE: mock
      - run: npm run demo:ripor
